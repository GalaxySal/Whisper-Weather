[package]
name = "whisper-weather-app"
version = "1.0.3"
description = "Modern weather application with smooth animations and multi-platform support"
authors = ["Zentaria"]
edition = "2021"
license = "MIT"
repository = "https://github.com/zentaria/whisper-weather"
homepage = "https://whisperweather.com"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "whisper_weather_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
dirs = "5"
notify = "6.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
urlencoding = "2.1"
tokio = { version = "1", features = ["full"] }
supabase_rs = { version = "0.5.0", features = ["rustls"] }
chrono = "0.4.42"
dotenvy = "0.15"
uuid = { version = "1.0", features = ["v4"] }
once_cell = "1.19"

[target.'cfg(target_os = "android")'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"], default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
# iOS uses native TLS, no OpenSSL needed at all

[target.'cfg(target_os = "linux")'.dependencies]
# Linux uses rustls to avoid OpenSSL compilation issues
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
supabase_rs = { version = "0.5", features = ["rustls"] }
tauri-plugin-updater = { version = "2.9", features = ["rustls-tls"] }
tokio-native-tls = { version = "0.3", features = [], default-features = false, optional = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "windows"))'.dependencies]
# Disable OpenSSL for Windows ARM64 to avoid compilation issues
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
openssl-sys = { version = "0.9", features = [], default-features = false, optional = true }

[target.'cfg(all(target_arch = "x86_64", target_os = "windows"))'.dependencies]
# Disable OpenSSL for Windows x64 to avoid compilation issues
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
openssl-sys = { version = "0.9", features = [], default-features = false, optional = true }

[target.'cfg(all(target_arch = "x86", target_os = "windows"))'.dependencies]
# Disable OpenSSL for Windows x86 to avoid compilation issues
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
openssl-sys = { version = "0.9", features = [], default-features = false, optional = true }

[[bin]]
name = "whisper-weather"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

