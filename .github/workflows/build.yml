name: Build and Release

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        
    runs-on: ${{ matrix.platform }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies (ubuntu only)
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev patchelf
        
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        
    - name: Sync node version and setup cache
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      timeout-minutes: 20
      continue-on-error: false
      
    - name: Build the app
      run: |
        echo "Building app for testing..."
        npm run tauri build
      timeout-minutes: ${{ matrix.platform == 'windows-latest' && 120 || matrix.platform == 'macos-latest' && 120 || 20 }}
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: whisper-weather-${{ matrix.platform }}
        path: |
          src-tauri/target/release/bundle/
          !src-tauri/target/release/bundle/**/*.deb
          !src-tauri/target/release/bundle/**/*.rpm
        retention-days: 30

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Run linting
      run: npm run lint
      
    - name: Type check
      run: npm run type-check

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install cargo-audit
      run: cargo install cargo-audit
      
    - name: Security audit
      run: cargo audit
      working-directory: src-tauri
      
    - name: Node.js setup
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Security audit
      run: npm audit --audit-level moderate

  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
        
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        
    - name: Sync node version and setup cache
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      timeout-minutes: 5
      
    - name: Install cargo-tauri CLI
      run: cargo install tauri-cli --version "^2.0"
      timeout-minutes: 10
      
    - name: Setup Android environment
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        NDK_VERSION=$(ls -1 $ANDROID_HOME/ndk | head -1)
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "NDK_VERSION=$NDK_VERSION" >> $GITHUB_ENV
        
    - name: Build Android APK
      run: |
        cd src-tauri
        cargo tauri android init
        cargo tauri android build
      timeout-minutes: 60
        
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: whisper-weather-android
        path: |
          src-tauri/target/*/android/*/build/outputs/apk/**/*.apk
        retention-days: 30

  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
        
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        
    - name: Install CocoaPods
      run: |
        cd src-tauri
        sudo gem install cocoapods
        if [ -f "Podfile" ]; then
          pod install
        else
          echo "No Podfile found, skipping pod install"
        fi
        
    - name: Sync node version and setup cache
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      timeout-minutes: 5
      
    - name: Install cargo-tauri CLI
      run: cargo install tauri-cli --version "^2.0"
      timeout-minutes: 10
      
    - name: Build iOS app
      run: |
        cd src-tauri
        cargo tauri ios init
        cargo tauri ios build
      timeout-minutes: 90
        
    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: whisper-weather-ios
        path: |
          src-tauri/target/*/ios/build/Build/Products/Debug-iphoneos/*.app
        retention-days: 30
