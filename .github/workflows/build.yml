name: Build and Release

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x64
          - platform: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: windows-latest
            target: aarch64-pc-windows-msvc
            arch: arm64
          - platform: windows-latest
            target: i686-pc-windows-msvc
            arch: x86
          - platform: macos-latest
            target: x86_64-apple-darwin
            arch: x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
        
    runs-on: ${{ matrix.platform }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install system dependencies
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev patchelf
        # Install cross-compilation dependencies for ARM64
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          # Add ARM64 architecture support first
          sudo dpkg --add-architecture arm64
          # Add ARM64 ports repository for Ubuntu 24.04 and disable problematic security.ubuntu.com for ARM64
          printf "Types: deb\nURIs: http://ports.ubuntu.com/ubuntu-ports/\nSuites: noble noble-updates noble-backports\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\nArchitectures: arm64\n" | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources
          # Backup and disable AMD64 security repository to prevent ARM64 404 errors
          sudo cp /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.bak
          # Create new sources.list without security repository for ARM64 compatibility
          printf "Types: deb\nURIs: http://archive.ubuntu.com/ubuntu/\nSuites: noble noble-updates noble-backports\nComponents: main restricted universe multiverse\nSigned-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg\nArchitectures: amd64\n" | sudo tee /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          # Install cross-compilation tools and libraries
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu pkg-config libglib2.0-dev:arm64 libgtk-3-dev:arm64 libwebkit2gtk-4.1-dev:arm64
        fi
        
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}
      
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        
    - name: Sync node version and setup cache
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      timeout-minutes: 20
      continue-on-error: false
      
    - name: Build the app
      run: |
        echo "Building app for ${{ matrix.target }}..."
        # Set up cross-compilation environment for ARM64 Linux
        if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
          export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        fi
        npm run tauri build -- --target ${{ matrix.target }}
      timeout-minutes: ${{ matrix.platform == 'windows-latest' && 120 || matrix.platform == 'macos-latest' && 120 || 20 }}
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: whisper-weather-${{ matrix.platform }}-${{ matrix.arch }}
        path: |
          src-tauri/target/${{ matrix.target }}/release/bundle/
          !src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          !src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
        retention-days: 30

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test
      
    - name: Run linting
      run: npm run lint
      
    - name: Type check
      run: npm run type-check

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install cargo-audit
      run: cargo install cargo-audit
      
    - name: Security audit
      run: cargo audit
      working-directory: src-tauri
      
    - name: Node.js setup
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Security audit
      run: npm audit --audit-level moderate

  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
        
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        
    - name: Sync node version and setup cache
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      timeout-minutes: 5
      
    - name: Install cargo-tauri CLI
      run: cargo install tauri-cli --version "^2.0"
      timeout-minutes: 10
      
    - name: Setup Android environment
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        NDK_VERSION=$(ls -1 $ANDROID_HOME/ndk | head -1)
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "NDK_VERSION=$NDK_VERSION" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
        # Add Android NDK toolchain to PATH
        echo "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
        
    - name: Install OpenSSL for Android
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config
        
    - name: Build Android APK
      run: |
        cd src-tauri
        # Set environment variables for Android cross-compilation
        export AR_aarch64_linux_android=llvm-ar
        export RANLIB_aarch64_linux_android=llvm-ranlib
        export CC_aarch64_linux_android=aarch64-linux-android24-clang
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android24-clang
        export OPENSSL_STATIC=1
        export OPENSSL_DIR=/usr/local/ssl
        export PKG_CONFIG_ALLOW_CROSS=1
        cargo tauri android init
        cargo tauri android build
      timeout-minutes: 60
        
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v4
      with:
        name: whisper-weather-android
        path: |
          src-tauri/target/*/android/*/build/outputs/apk/**/*.apk
        retention-days: 30

  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-ios x86_64-apple-ios aarch64-apple-ios-sim
        
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        
    - name: Install CocoaPods
      run: |
        cd src-tauri
        sudo gem install cocoapods
        if [ -f "Podfile" ]; then
          pod install
        else
          echo "No Podfile found, skipping pod install"
        fi
        
    - name: Sync node version and setup cache
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      timeout-minutes: 5
      
    - name: Install cargo-tauri CLI
      run: cargo install tauri-cli --version "^2.0"
      timeout-minutes: 30
      
    - name: Build iOS app
      run: |
        cd src-tauri
        cargo tauri ios init
        
        # Try to list available simulators (may fail, continue anyway)
        echo "Attempting to list available iOS Simulators..."
        xcrun simctl list devices available || echo "Could not list simulators, continuing with build..."
        
        # Build for iOS Simulator without code signing using generic destination
        xcodebuild -project gen/apple/whisper-weather-app.xcodeproj \
                   -scheme whisper-weather-app_iOS \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   -destination 'generic/platform=iOS Simulator' \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGN_ENTITLEMENTS="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=NO \
                   build || \
        xcodebuild -project gen/apple/whisper-weather-app.xcodeproj \
                   -scheme whisper-weather-app_iOS \
                   -sdk iphonesimulator \
                   -configuration Debug \
                   -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGN_ENTITLEMENTS="" \
                   AD_HOC_CODE_SIGNING_ALLOWED=NO \
                   build
      timeout-minutes: 90
        
    - name: Upload iOS artifacts
      uses: actions/upload-artifact@v4
      with:
        name: whisper-weather-ios
        path: |
          src-tauri/target/*/ios/build/Build/Products/Debug-iphoneos/*.app
        retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install cargo-audit
      run: cargo install cargo-audit
      
    - name: Security audit (Rust)
      run: cargo audit
      working-directory: src-tauri
      
    - name: Node.js setup
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install frontend dependencies
      run: npm ci
      
    - name: Security audit (Node.js)
      run: npm audit --audit-level=moderate
      
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript, typescript, rust
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:javascript"
