name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [release-triggered]

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Generate changelog
      id: changelog
      run: |
        # Son tag'i bul
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        if [ -z "$LAST_TAG" ]; then
          # İlk release ise tüm commit'leri al
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
        else
          # Son tag'den bu yana olan commit'leri al
          CHANGELOG=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
        fi
        
        if [ -z "$CHANGELOG" ]; then
          CHANGELOG="- Initial release"
        fi
        
        # Changelog'i output olarak ayarla
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: 'Whisper Weather ${{ github.ref }}'
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: false

  build-and-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        
        include:
          - platform: ubuntu-latest
            ext: deb
            name: whisper-weather_amd64
          - platform: windows-latest
            ext: exe
            name: whisper-weather_x64_setup
          - platform: macos-latest
            ext: dmg
            name: whisper-weather_x64
            
    runs-on: ${{ matrix.platform }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies (ubuntu only)
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev patchelf
        
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      timeout-minutes: 10
      continue-on-error: false
      
    - name: Build application
      run: npm run tauri:build
      timeout-minutes: 20
      
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: 'Whisper Weather ${{ github.ref_name }}'
        body: ${{ needs.create-release.outputs.changelog }}
        draft: false
        prerelease: false
        files: |
          src-tauri/target/release/bundle/${{ matrix.ext }}/${{ matrix.name }}.${{ matrix.ext }}
          src-tauri/target/release/bundle/${{ matrix.ext }}/${{ matrix.name }}.${{ matrix.ext }}.sig
