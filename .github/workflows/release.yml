name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: 'Whisper Weather ${{ github.ref }}'
        body: |
          ## Changes in ${{ github.ref }}
          - Automated release from GitHub Actions
          - Multi-platform builds included
        draft: false
        prerelease: false

  build-and-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        
        include:
          - platform: ubuntu-latest
            ext: deb
            name: whisper-weather_amd64
          - platform: windows-latest
            ext: exe
            name: whisper-weather_x64_setup
          - platform: macos-latest
            ext: dmg
            name: whisper-weather_x64
            
    runs-on: ${{ matrix.platform }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies (ubuntu only)
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev patchelf
        
    - name: Rust setup
      uses: dtolnay/rust-toolchain@stable
      
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.19.0'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      timeout-minutes: 10
      continue-on-error: false
      
    - name: Build application
      run: npm run tauri:build
      timeout-minutes: 20
      
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: 'Whisper Weather ${{ github.ref_name }}'
        body: 'See the assets to download and install this version.'
        draft: false
        prerelease: false
        files: |
          src-tauri/target/release/bundle/${{ matrix.ext }}/${{ matrix.name }}.${{ matrix.ext }}
          src-tauri/target/release/bundle/${{ matrix.ext }}/${{ matrix.name }}.${{ matrix.ext }}.sig
